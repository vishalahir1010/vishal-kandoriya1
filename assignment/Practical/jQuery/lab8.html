<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="box"></div>
    <button id="btn1">Animation</button>
    <script src="jquery.min.js"></script>
    <script>
        $(".box").css({
            backgroundColor:"red",
            height:"200px",
            width:"200px",
            border:"1px solid black",
            margin:"10px"
        })
        $("#btn1").click(function(){
            $(".box").animate({
                left:"350px",
                opacity:"0.3"
            })
        })
    </script>
</body>
</html>
