<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <div class="abc">Lorem ipsum dolor sit amet consectetur adipisicing elit. Natus reprehenderit voluptas incidunt doloribus ab maiores sed, eligendi pariatur repudiandae culpa officia distinctio sunt autem iure, ullam quam? Tempora, excepturi eum?</div>
    <button id="btn1">Show</button>
    <button id="btn2">Hide</button>
    <script src="jquery.min.js"></script>
    <script>
        $("#btn1").click(function(){
            $(".abc").show(2000)
        })
         $("#btn2").click(function(){
            $(".abc").hide(2000)
        })
    </script>
</body>
</html>
