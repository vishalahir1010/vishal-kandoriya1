<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <textarea name="txt" id="txt"></textarea>
    <div id="demo">Total word-<span id="cnt">00</span></div>
    <script src="jquery.min.js"></script>
    <script>
        let count=0
        $("#txt").keyup(function(){
            count = count+1
            $("#cnt").html(count)
        })
    </script>

</body>
</html>
