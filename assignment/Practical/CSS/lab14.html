<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2{
            font-family: sans-serif;
            font-weight: 900;
        }
        a{
            text-decoration: none;
            color: blue;
            font-weight: 1000;
        }
        a:hover{
            color: darkgreen;
        }
        a:visited{
            color: blue;
        }
        a:active{
            color: gold;
        }
        p::first-line{
            color: aqua;
            font-weight: bold;
            font-size: large;
        }
        h2::before{
            content:"#";
            color: rgb(46, 134, 105);
        }
    </style>
</head>
<body>
    <h2>Usefull links</h2>
    
    <a href="https://www.google.com">Google</a><br><br>
    <a href="https://Whatsapp.com">Whatsapp</a><br><br>
    <a href="https://www.youtube.com">Youtube</a><br><br>

</body>
</html>
