<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        box-sizing: border-box;
        padding: 0;
    }
    body{
        font-family: sans-serif;
        background:#f4f7f8;
        color:#333;
    }
    h1{
        text-align: center;
        background:#0f3d3e;
        padding: 40px 20px;
        color: white;
        font-size:28px;
    }
    h2{
        height: 150px;
        border: 1px solid black;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 15px;
        background:white;
        box-shadow:0 8px 20px black;
        transition:0.3s;
        font-weight:500;
    }
    h2:hover{
        transform:translateY(-5px);
        box-shadow:0 12px 25px rgba(0,0,0,0.15);
    }

    .box{
        display: grid;
        grid-template-columns:repeat(2,1fr);
        gap: 20px;
        padding: 20px;
        }
    footer{
        background-color:#12332d;
        text-align: center;
        padding: 30px;
        color: white;
        margin-top:20px;
    }
    @media(max-width:768px){
        .box{
            grid-template-columns:1fr;
            padding:20px;
        }
        h1{
            font-size:22px;
            padding:25px;
        }
    }
        
</style>
<body>
    <h1>MY Website Header</h1>
    <div class="box">
        <h2>Content Section 1</h2>
        <h2>Content Section 2</h2>
        <h2>Content Section 3</h2>
    </div>
    <footer>
        <p> My Website Footer</p>
    </footer>
</body>
</html>
