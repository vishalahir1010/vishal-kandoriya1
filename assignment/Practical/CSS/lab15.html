<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       body{
        background-color: black;
        color: yellow;
       } 
       header{
        border-bottom: 2px solid yellow;
        padding: 20px;
        text-align: center;
       }
       section{
        padding: 120px;
        border-bottom: 2px solid yellow;
        text-align: center;
       }
       section button{
        padding: 10px;
        width: 80px;
        border-radius: 20px;
        background-color: black;
        color: yellow;
        border:1px solid yellow;
        cursor: pointer;
        transition: 0.5s;
       }
       section button:hover{
        background-color: yellow;
        color: black;
        transform: scale(1.1);
        box-shadow: 0px 2px 20px yellow;
       }
       footer{
        text-align: center;
        padding-top: 10px;
       }
       
    </style>
</head>
<body>
    <header>
        <h1>Simple web page</h1>
    </header>
    <section>
        <h1>Wellcome</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Rerum eaque soluta similique consequatur ab nisi fugiat necessitatibus magnam nam mollitia perferendis unde minus accusantium alias fuga maiores, dolores aut sint.</p>
        <button>click</button>
    </section>
    <footer>
        <h1>my website</h1>
    </footer>
</body>
</html>
