
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Premium Portfolio</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body {
  font-family: sans-serif;
  background: #f5f7ff;
}

.navbar {
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

.hero {
  height: 550px;
  background:#7c3aed;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.hero h1 {
  font-size: 3rem;
  font-weight: 700;
}

.card {
  border: none;
  border-radius: 15px;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-10px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

footer {
  background: #111827;
}

</style>

</head>

<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-primary p-3">
  <div class="container">
    <h3 class="text-white">My Portfolio</h3>
    <button class="btn btn-light" data-bs-toggle="modal" data-bs-target="#contactModal">
      Contact Me
    </button>
  </div>
</nav>


<section class="hero">
  <div>
    <h1>Hello, I'm a Web Designer</h1>
    <p>Creating modern and responsive websites</p>
  </div>
</section>

<div class="modal fade" id="contactModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header bg-primary text-white">
        <h5>Contact Me</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form>
          <input type="text" class="form-control mb-3" placeholder="Your Name">
          <input type="email" class="form-control mb-3" placeholder="Your Email">
          <textarea class="form-control mb-3" placeholder="Your Message"></textarea>
          <button class="btn btn-primary w-100">Send Message</button>
        </form>
      </div>

    </div>
  </div>
</div>


<footer class="text-white text-center p-4">
  <p>© 2026 My Portfolio | Designed by me</p>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
