<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>

body {
  margin: 0;
  font-family: Arial;
}

.container {
  display: grid;
  grid-template-columns: repeat(2, 1fr); 
  gap: 10px;
  padding: 10px;
}


.header {
  background: orange;
  text-align: center;
  padding: 20px;
}


.sidebar {
  background: lightblue;
  padding: 20px;
}

.content {
  display: grid;
  gap: 20px;
}

.blog {
  background: lightyellow;
  padding: 20px;
}
.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.gallery img {
  width: 100%;
  height: 150px;
  object-fit: cover;
}

.box {
  background: gray;
  text-align: center;
  padding: 20px;
}

@media (max-width: 600px) {
  .container {
    grid-template-columns: repeat(1, 1fr);
  }

  .gallery {
    grid-template-columns: repeat(1, 1fr);
  }
}

</style>
</head>
<body>
  <div class="container">
  <div class="header">Header</div>

  <div class="sidebar">
    <h3>Sidebar</h3>
    <p>Menu 1</p>
    <p>Menu 2</p>
  </div>

  <div class="content">

    <div class="blog">
      <h2>Blog Post</h2>
      <p>This is simple blog content.</p>
    </div>
    <div class="gallery">
      <img src="https://picsum.photos/300/200?1">
      <img src="https://picsum.photos/300/200?2">
      <img src="https://picsum.photos/300/200?3">
      <img src="https://picsum.photos/300/200?4">
      <img src="https://picsum.photos/300/200?5">
      <img src="https://picsum.photos/300/200?6">
    </div>
  </div>
  <div class="box">Box</div>
</div>

</body>
</html>
